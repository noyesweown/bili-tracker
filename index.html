      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .btn-back {
      background: #fff; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 18px; font-size: 13px; cursor: pointer; color: var(--text);
      display: flex; align-items: center; gap: 6px; transition: all 0.15s;
    }
    .btn-back:hover { border-color: var(--primary); color: var(--primary); }
    .detail-header-info { font-size: 14px; color: var(--text-secondary); }

    .detail-block {
      background: var(--card-bg); border-radius: var(--radius);
      padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow);
    }
    .detail-up-name {
      font-size: 22px; font-weight: 700; color: var(--text);
      margin-bottom: 4px; display: flex; align-items: center; gap: 10px;
    }
    .detail-meta { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

    /* 图表区块 */
    .chart-section { margin-bottom: 24px; }
    .section-title {
      font-size: 16px; font-weight: 600; color: var(--text);
      margin-bottom: 12px; padding-left: 4px; display: flex; align-items: center; gap: 8px;
    }
    .toolbar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .toolbar-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
    .btn-tiny {
      background: var(--primary-light); border: 1px solid var(--border); border-radius: 6px;
      padding: 3px 12px; font-size: 12px; cursor: pointer; color: var(--text-secondary);
      transition: all 0.15s;
    }
    .btn-tiny:hover { background: #dce9f9; border-color: var(--primary); }
    .btn-rate { background: var(--rate-bg); border-color: var(--rate-border); color: #7c3aed; }
    .btn-rate:hover { background: #f0eaff; }

    .checkbox-row {
      display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 14px;
      padding: 12px 14px; background: var(--primary-light); border-radius: 10px;
      border: 1px solid var(--border);
    }
    .checkbox-row.rate-row { background: #fdfbff; border-color: var(--rate-border); }
    .cb-item {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      font-size: 13px; user-select: none; padding: 4px 8px; border-radius: 6px;
      transition: bg 0.15s;
    }
    .cb-item:hover { background: rgba(0,0,0,0.04); }
    .cb-item input[type="checkbox"] { display: none; }
    .cb-dot {
      width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor;
      position: relative; flex-shrink: 0; opacity: 0.75; transition: all 0.2s;
    }
    .cb-item input:checked + .cb-dot { opacity: 1; background: currentColor; box-shadow: 0 0 0 3px currentColor22; }
    .cb-item input:not(:checked) + .cb-dot { opacity: 0.35; }

    .chart-wrapper { height: 420px; position: relative; }
    .chart-wrapper.short { height: 340px; }
    .rate-section { margin-top: 24px; border-top: 2px dashed var(--border); padding-top: 20px; }

    /* 视频列表 */
    .vid-table-wrap { margin-top: 20px; overflow-x: auto; }
    .vid-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .vid-table th {
      background: var(--primary-light); padding: 10px 12px; text-align: left;
      font-weight: 600; color: var(--primary); border-bottom: 2px solid var(--primary);
      white-space: nowrap; position: sticky; top: 0;
    }
    .vid-table td {
      padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top;
    }
    .vid-table tr:hover td { background: var(--primary-light); }
    .vid-title { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .vid-bvid { color: var(--primary); font-size: 12px; cursor: pointer; }
    .num-cell { font-variant-numeric: tabular-nums; text-align: right; }
    .pos { color: #52c41a; }
    .neg { color: #ff4d4f; }

    @media (max-width: 768px) {
      .up-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
      .chart-wrapper { height: 300px; }
      .chart-wrapper.short { height: 260px; }
      .container { padding: 16px 12px; }
      .detail-block { padding: 16px; }
      .export-bar { flex-direction: column; align-items: stretch; }

      /* 导航栏移动端适配 */
      .navbar {
        flex-wrap: wrap;
        height: auto;
        padding: 10px 14px;
        gap: 8px;
        justify-content: center;
      }
      .navbar-brand {
        flex: 1 1 100%;
        justify-content: center;
        order: -1;
      }
      .navbar-actions {
        flex: 1 1 100%;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
      }
      .nav-btn {
        padding: 5px 12px;
        font-size: 12px;
      }
      .fetch-time {
        display: none;
      }
    }
  </style>
</head>

      <h1>雀巢工作室</h1>
  <div class="navbar-actions">
    <span class="fetch-time" id="globalFetchTime">--</span>

<div class="container">

  <!-- ===== 首页：UP主列表 ===== -->
  <div class="page-home" id="pageHome">
    <div class="home-header">
      <h2>雀室UP主数据中心</h2>
      <p id="homeSubtitle">加载中...</p>
    </div>
    <div class="up-grid" id="upGrid"></div>

    <!-- 导出区域 -->
    <div class="export-bar" id="exportBar">
      <span class="export-bar-title">📋 选择导出：</span>
      <button class="btn-select-all" onclick="toggleExportAll()">全选/反选</button>
      <div class="export-ups" id="exportChips"></div>
      <button class="btn-export" onclick="doExport()">⬇️ 生成Excel</button>
    </div>
  </div>

  <!-- ===== 详情页：图表+视频列表 ===== -->
  <div class="page-detail" id="pageDetail">
    <div class="detail-nav">
      <button class="btn-back" onclick="showHome()">← 返回首页</button>
      <span class="detail-header-info">查看各指标趋势与变化率</span>
    </div>
    <div id="detailContent"></div>
  </div>

</div>

<script>
// ================================================================
//  数据 & 常量
// ================================================================
const METRIC_KEYS = ['view','like','coin','fav','share','danmaku','reply'];
const METRIC_LABELS = {
  view:'播放量', like:'点赞', coin:'投币', fav:'收藏',
  share:'分享', danmaku:'弹幕', reply:'评论'
};
// 每个指标的颜色 — 与 charts.html 保持一致
const COLORS = {
  view:'#e74c3c', like:'#3498db', coin:'#f1c40f',
  fav:'#1abc9c', share:'#9b59b6', danmaku:'#e67e22',
  reply:'#2980b9'
};

let _rawData = null;   // latest.json 完整数据
let _grouped = {};     // 按 UP主 分组后的数据
let _charts = {};      // 绝对值 Chart 实例
let _rateCharts = {};  // 变化率 Chart 实例

// ================================================================
//  初始化（数据已内嵌到 HTML 中，无需服务器，双击即可使用）
// ================================================================
(function init() {
  try {
    const dataEl = document.getElementById('bili-embedded-data');
    if (!dataEl || !dataEl.textContent.trim()) {
      throw new Error('内嵌数据为空');
    }
    _rawData = JSON.parse(dataEl.textContent);
    document.getElementById('globalFetchTime').textContent = '更新于 ' + fmtTime(_rawData.fetch_time);
    groupByUp();
    renderHome();
  } catch (e) {
    document.getElementById('homeSubtitle').innerHTML =
      '<span style="color:#e74c3c;">❌ 无法加载数据，请运行 generate_charts.js 重新生成 app.html</span>';
  }
})();

function fmtTime(t) {
  if (!t) return '--';
  try { return new Date(t).toLocaleString('zh-CN'); } catch { return t; }
}

// ================================================================
//  按 UP主 分组
// ================================================================
function groupByUp() {
  _grouped = {};
  for (const v of (_rawData.videos || [])) {
    const name = v.up_name || v.config_name || '未知';
    if (!_grouped[name]) _grouped[name] = [];
    _grouped[name].push(v);
  }
  // 按发布日期排序（新→旧）
  for (const k of Object.keys(_grouped)) {
    _grouped[k].sort((a,b) => (b.pub_date||'').localeCompare(a.pub_date||''));
  }
}

// ================================================================
//  页面导航
// ================================================================
function showHome() {
  document.getElementById('pageHome').classList.remove('hidden');
  document.getElementById('pageDetail').classList.remove('active');
}

function showDetail(upName) {
  // 销毁旧图表
  destroyAllCharts();
  document.getElementById('pageHome').classList.add('hidden');
  document.getElementById('pageDetail').classList.add('active');
  renderDetail(upName);
}

function showExportBar() {
  const bar = document.getElementById('exportBar');
  bar.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ================================================================
//  首页渲染
// ================================================================
function renderHome() {
  const names = Object.keys(_grouped);
  const totalVids = (_rawData.videos||[]).length;
  document.getElementById('homeSubtitle').textContent =
    `共 ${names.length} 位UP主 · ${totalVids} 个视频`;

  let html = '';
  for (const name of names) {
    const vids = _grouped[name];
    const fans = vids[0]?.up_fans || 0;
        const faceUrl = vids[0]?.up_face || '';
    // 取最新一个视频的数据作为概览
    const latest = vids[0];
    const totalViews = vids.reduce((s,v)=>s+(v.view||0),0);

    html += `
      <div class="up-card" onclick="showDetail('${escAttr(name)}')">
        <div class="up-card-name">
          ${faceUrl ? '<img class=\"up-avatar\" src=\"' + escAttr(faceUrl) + '\" referrerpolicy=\"no-referrer\" onerror=\"this.style.display=\'none\'">' : ''}
          ${escHtml(name)}
          <span class="badge">${vids.length}个视频</span>
        </div>
        <div class="up-card-stats">
          <div class="stat-item">
            <div class="stat-val">${fmtShortNum(fans)}</div>
            <div class="stat-label">粉丝数</div>
          </div>
          <div class="stat-item">
            <div class="stat-val">${fmtShortNum(totalViews)}</div>
            <div class="stat-label">总播放量</div>
          </div>
          <div class="stat-item">
            <div class="stat-val">${fmtShortNum(latest?.view||0)}</div>
            <div class="stat-label">最新视频播放</div>
          </div>
          <div class="stat-item">
            <div class="stat-val">${fmtShortNum(latest?.like||0)}</div>
            <div class="stat-label">最新视频点赞</div>
          </div>
        </div>
        <div class="up-card-vids">
          <span>最新: ${escHtml((latest?.title||'--').substring(0,20))}</span>
          <span>${latest?.pub_date||'--'} 发布</span>
        </div>
      </div>`;
  }
  document.getElementById('upGrid').innerHTML = html;

  // 渲染导出芯片
  let chipHtml = '';
  for (const name of names) {
    chipHtml += `<span class="export-chip selected" data-up="${escAttr(name)}" onclick="toggleChip(this)">${escHtml(name)}</span>`;
  }
  document.getElementById('exportChips').innerHTML = chipHtml;
}

function toggleChip(el) {
  el.classList.toggle('selected');
}

function toggleExportAll() {
  const chips = document.querySelectorAll('.export-chip');
  const allSelected = Array.from(chips).every(c => c.classList.contains('selected'));
  chips.forEach(c => c.classList.toggle('selected', !allSelected));
}

// ================================================================
//  CSV 下载（从 latest.json 实时生成，无需后端）
// ================================================================
function downloadCSV() {
  if (!_rawData || !_rawData.videos) { alert('数据未加载'); return; }

  const header = ['UP主','视频标题','BV号','发布日期','播放量','点赞','投币','收藏','分享','弹幕','评论','粉丝数'];
  const rows = _rawData.videos.map(v => [
    v.up_name||v.config_name||'', v.title||'', v.bvid||'',
    v.pub_date||'', v.view||0, v.like||0, v.coin||0,
    v.fav||0, v.share||0, v.danmaku||0, v.reply||0, v.up_fans||''
  ]);

  // BOM + CSV 内容（确保 Excel 打开不乱码）
  const BOM = '\uFEFF';
  const csvContent = BOM + [header, ...rows]
    .map(row => row.map(cell => {
      const str = String(cell == null ? '' : cell);
      // 如果包含逗号、引号或换行，需要用双引号包裹
      if (str.includes(',') || str.includes('"') || str.includes('\n')) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    }).join(','))
    .join('\n');

  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `BiliTracker_${fmtDateStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ================================================================
//  Excel 导出
// ================================================================
function doExport() {
  const selected = Array.from(document.querySelectorAll('.export-chip.selected'))
    .map(el => el.getAttribute('data-up'));
  if (selected.length === 0) { alert('请至少选择一位UP主'); return; }

  // 构建工作簿
  const wb = XLSX.utils.book_new();

  // 汇总表
  const summaryRows = [['UP主','视频数量','粉丝数','总播放量','总点赞','总投币','总收藏','总分享','总弹幕','总评论']];
  for (const name of selected) {
    const vids = _grouped[name] || [];
    const fans = vids[0]?.up_fans || 0;
    summaryRows.push([
      name,
      vids.length,
      fans,
      sumKey(vids,'view'), sumKey(vids,'like'), sumKey(vids,'coin'),
      sumKey(vids,'fav'), sumKey(vids,'share'), sumKey(vids,'danmaku'),
      sumKey(vids,'reply')
    ]);
  }
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
  XLSX.utils.book_append_sheet(wb, wsSummary, '汇总');

  // 每个 UP主 一个 sheet
  for (const name of selected) {
    const vids = _grouped[name] || [];
    const rows = [
      ['序号','视频标题','BV号','发布日期','时长(秒)','播放量','点赞','投币','收藏','分享','弹幕','评论','粉丝数']
    ];
    vids.forEach((v,i) => {
      rows.push([
        i+1, v.title, v.bvid, v.pub_date, v.duration,
        v.view, v.like, v.coin, v.fav, v.share,
        v.danmaku, v.reply, v.up_fans
      ]);
    });
    // 截断 sheet 名（Excel 限制 31 字符）
    let sheetName = name.substring(0, 31);
    const ws = XLSX.utils.aoa_to_sheet(rows);
    // 设置列宽
    ws['!cols'] = [
      {wch:5},{wch:40},{wch:14},{wch:12},{wch:8},
      {wch:12},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:12}
    ];
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  }

  const fileName = `BiliTracker_${fmtDateStr()}.xlsx`;
  XLSX.writeFile(wb, fileName);
}

function sumKey(vids, key) { return vids.reduce((s,v)=>s+(v[key]||0),0); }
function fmtDateStr() {
  const d = new Date();
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}
function pad(n){ return n<10?'0'+n:''+n; }

// ================================================================
//  详情页渲染（核心：双图交互式图表）
// ================================================================
function renderDetail(upName) {
  const vids = _grouped[upName] || [];
  if (!vids.length) { document.getElementById('detailContent').innerHTML = '<p>暂无数据</p>'; return; }

  const safeId = 'dc_' + upName.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g,'_');
  const rateId = 'dr_' + safeId;

  // 构建标签和数据（按发布时间从旧→新排列，用于折线图时序）
  const sortedVids = [...vids].reverse(); // 旧 → 新
  const labels = sortedVids.map(v => shortenTitle(v.title, v.pub_date));
  const allData = {};
  for (const k of METRIC_KEYS) { allData[k] = sortedVids.map(v => v[k]||0); }

  // 变化率数据
  const rateData = {}; const len = sortedVids.length;
  for (const k of METRIC_KEYS) {
    rateData[k] = [];
    for (let i=0;i<len;i++) { rateData[k].push(i===0?0:(allData[k][i]-allData[k][i-1])); }
  }

  // 粉丝数
  const fans = vids[0]?.up_fans || 0;

  let html = `
    <div class="detail-block">
      <div class="detail-up-name">${escHtml(upName)}
        <span style="font-size:13px;font-weight:400;color:#888;">${vids.length} 个视频 · 粉丝 ${fans.toLocaleString()}</span>
      </div>

      <!-- 图1: 绝对数值 -->
      <div class="chart-section">
        <div class="section-title">📈 绝对数值趋势</div>
        <div class="toolbar">
          <span class="toolbar-label">选择指标：</span>
          <button type="button" onclick="toggleAll('${safeId}',true)" class="btn-tiny">全选</button>
          <button type="button" onclick="toggleAll('${safeId}',false)" class="btn-tiny">反选</button>
        </div>
        <div class="checkbox-row" id="cb_${safeId}">
          ${METRIC_KEYS.map(k => checkboxHtml(k,safeId)).join('\n')}
        </div>
        <div class="chart-wrapper"><canvas id="${safeId}"></canvas></div>
      </div>

      <!-- 图2: 变化率 -->
      <div class="chart-section rate-section">
        <div class="section-title">📉 变化率 / 斜率（相邻视频差值）</div>
        <div class="toolbar">
          <span class="toolbar-label">选择指标：</span>
          <button type="button" onclick="toggleAllRate('${rateId}',true)" class="btn-tiny btn-rate">全选</button>
          <button type="button" onclick="toggleAllRate('${rateId}',false)" class="btn-tiny btn-rate">反选</button>
        </div>
        <div class="checkbox-row rate-row" id="cb_${rateId}">
          ${METRIC_KEYS.map(k => checkboxHtml(k,rateId,true)).join('\n')}
        </div>
        <div class="chart-wrapper short"><canvas id="${rateId}"></canvas></div>
      </div>
    </div>

    <!-- 视频详情表 -->
    <div class="detail-block">
      <div class="section-title">📋 视频详细数据</div>
      <div class="vid-table-wrap">
        <table class="vid-table">
          <thead><tr>
            <th>#</th><th>标题</th><th>BV号</th><th>发布日期</th>
            <th class="num-cell">播放</th><th class="num-cell">点赞</th><th class="num-cell">投币</th>
            <th class="num-cell">收藏</th><th class="num-cell">分享</th><th class="num-cell">弹幕</th><th class="num-cell">评论</th>
          </tr></thead>
          <tbody>
            ${vids.map((v,i)=>`
              <tr>
                <td>${i+1}</td>
                <td><div class="vid-title" title="${escAttr(v.title)}">${escHtml(v.title)}</div></td>
                <td><a class="vid-bvid" href="https://www.bilibili.com/video/${v.bvid}" target="_blank">${v.bvid}</a></td>
                <td>${v.pub_date||'--'}</td>
                <td class="num-cell">${(v.view||0).toLocaleString()}</td>
                <td class="num-cell">${(v.like||0).toLocaleString()}</td>
                <td class="num-cell">${(v.coin||0).toLocaleString()}</td>
                <td class="num-cell">${(v.fav||0).toLocaleString()}</td>
                <td class="num-cell">${(v.share||0).toLocaleString()}</td>
                <td class="num-cell">${(v.danmaku||0).toLocaleString()}</td>
                <td class="num-cell">${(v.reply||0).toLocaleString()}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>

  document.getElementById('detailContent').innerHTML = html;

  // 初始化图表 —— 等待 DOM 渲染完成
  requestAnimationFrame(() => {
    initAbsChart(safeId, labels, allData);
    initRateChart(rateId, labels, rateData);
  });
}

function checkboxHtml(k, chartId, isRate=false) {
  const onchange = isRate ? `updateRateChart('${chartId}')` : `updateChart('${chartId}')`;
  return `<label class="cb-item" style="color:${COLORS[k]}">
    <input type="checkbox" checked onchange="${onchange}" data-key="${k}" data-chart="${chartId}">
    <span class="cb-dot"></span>${METRIC_LABELS[k]}
  </label>`;
}

function shortenTitle(t, pubDate) {
  if (!t) return '--';
  const datePart = pubDate ? pubDate + '\n' : '';
  // 用 \n 分割让长标题换行显示，横轴会显示：日期 + 标题
  return datePart + (t.length > 18 ? t.substring(0,18)+'\n'+t.substring(18,36)+(t.length>36?'…':'') : t);
}

// ================================================================
//  图表初始化 & 更新逻辑（与 charts.html 一致）
// ================================================================

function initAbsChart(id, labels, allData) {
  const ctx = document.getElementById(id)?.getContext('2d');
  if (!ctx) return;
  const datasets = METRIC_KEYS.map(k => ({
    label: METRIC_LABELS[k], data: allData[k],
    borderColor: COLORS[k], backgroundColor: COLORS[k]+'18',
    borderWidth: 2.5, pointRadius: 4, pointHoverRadius: 7,
    tension: 0.35, fill: false
  }));
  _charts[id] = new Chart(ctx, {
    type: 'line', data: { labels, datasets },
    options: makeAbsOptions()
  });
}

function initRateChart(id, labels, rateData) {
  const ctx = document.getElementById(id)?.getContext('2d');
  if (!ctx) return;
  const datasets = METRIC_KEYS.map(k => ({
    label: METRIC_LABELS[k], data: rateData[k],
    borderColor: COLORS[k], backgroundColor: COLORS[k]+'18',
    borderWidth: 2, pointRadius: 3, pointHoverRadius: 6,
    tension: 0.3, fill: false, borderDash: [6,3]
  }));
  _rateCharts[id] = new Chart(ctx, {
    type: 'line', data: { labels, datasets },
    options: makeRateOptions()
  });
}

function makeAbsOptions() {
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          title: items => (items[0]?.label||'').replace(/\n/g,' '),
          label: c => c.dataset.label + ': ' + c.parsed.y.toLocaleString()
        }
      }
    },
    scales: {
      x: { ticks: { maxRotation: 45, font:{size:10} }, grid: { color:'#f0f0f0' } },
      y: { beginAtZero: true, grid: { color:'#f5f5f5' } }
    }
  };
}

function makeRateOptions() {
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          title: () => '',
          label: c => {
            const v = c.parsed.y;
            return c.dataset.label + ': ' + (v>=0?'+':'') + v.toLocaleString();
          },
          afterLabel: c => {
            const v = c.parsed.y;
            if (v===0) return '(基准点)';
            return v > 0 ? '↑ 增长' : '↓ 下降';
          }
        }
      }
    },
    scales: {
      x: { ticks: { maxRotation: 45, font:{size:10} }, grid: { color:'#f0f0f0' } },
      y: { grid: { color:'#f5f5f5' } } // 允许负值
    }
  };
}

// ---- 图1 更新 ----
function updateChart(chartId) {
  const chart = _charts[chartId]; if(!chart) return;
  applyVisibility(chart, chartId, 'cb_' + chartId);
  recalcYAxis(chart, true);
  chart.update();
}

// ---- 图2 更新 ----
function updateRateChart(chartId) {
  const chart = _rateCharts[chartId]; if(!chart) return;
  applyVisibility(chart, chartId, 'cb_' + chartId);
  recalcYAxis(chart, false);
  chart.update();
}

function applyVisibility(chart, chartId, cbContainerId) {
  const cbs = document.querySelectorAll(`#${cbContainerId} input[data-key]`);
  const visibleKeys = [];
  cbs.forEach(cb => { if(cb.checked) visibleKeys.push(cb.dataset.key); });
  for (let j=0;j<chart.data.datasets.length;j++) {
    chart.data.datasets[j].hidden = !visibleKeys.includes(METRIC_KEYS[j]);
  }
}

// Y轴适配
function recalcYAxis(chart, absMode) {
  let gMax = -Infinity, gMin = Infinity, hasVisible = false;
  for (const ds of chart.data.datasets) {
    if(ds.hidden) continue;
    hasVisible=true;
    for(const v of ds.data){
      const n=Number(v);
      if(n>gMax)gMax=n;
      if(n<gMin)gMin=n;
    }
  }
  if(!hasVisible){gMax=100;gMin=absMode?0:-100;}

  if(absMode) {
    const niceMax=getNiceMax(gMax);
    const step=getNiceStep(niceMax);
    chart.options.scales.y.min=0;
    chart.options.scales.y.max=niceMax;
    chart.options.scales.y.ticks.stepSize=step;
    chart.options.scales.y.ticks.callback=formatNum;
  } else {
    const absM=Math.max(Math.abs(gMax),Math.abs(gMin));
    const nm=getNiceRateMax(absM);
    const step=getNiceRateStep(nm);
    chart.options.scales.y.min=-nm;
    chart.options.scales.y.max=nm;
    chart.options.scales.y.ticks.stepSize=step;
    chart.options.scales.y.ticks.callback=formatRateNum;
  }
}

// 取整函数
function getNiceMax(val) {
  if(val<=100)return Math.ceil(val/10)*10;
  if(val<=10000)return Math.ceil(val/500)*500;
  if(val<=100000)return Math.ceil(val/10000)*10000;
  if(val<=1000000)return Math.ceil(val/100000)*100000;
  if(val<=20000000)return Math.ceil(val/1000000)*1000000;
  return Math.ceil(val/10000000)*10000000;
}
function getNiceStep(m) {
  if(m<=500)return 50;if(m<=10000)return 500;if(m<=100000)return 10000;
  if(m<=1000000)return 100000;if(m<=20000000)return 1000000;return 5000000;
}
function getNiceRateMax(a) {
  if(a<=50)return Math.ceil(a/10)*10||10;if(a<=5000)return Math.ceil(a/500)*500;
  if(a<=50000)return Math.ceil(a/5000)*5000;if(a<=500000)return Math.ceil(a/50000)*50000;
  if(a<=5000000)return Math.ceil(a/500000)*500000;return Math.ceil(a/5000000)*5000000;
}
function getNiceRateStep(m) {
  if(m<=100)return 10;if(m<=5000)return 500;if(m<=50000)return 5000;
  if(m<=500000)return 50000;if(m<=5000000)return 500000;return 5000000;
}
function formatNum(v) {
  if(v>=10000000)return(v/10000000).toFixed(0)+'千万';
  if(v>=10000)return(v/10000).toFixed(v>=100000?0:1)+'万';return v.toLocaleString();
}
function formatRateNum(v) {
  if(v>=0)return(v>=10000000?'+'+(v/10000000).toFixed(0)+'千万':v>=10000?'+'+(v/10000).toFixed(v>=100000?0:1)+'万':'+'+v.toLocaleString());
  if(v<=-10000000)return'-'+(Math.abs(v)/10000000).toFixed(0)+'千万';
  if(v<=-10000)return'-'+(Math.abs(v)/10000).toFixed(Math.abs(v)>=100000?0:1)+'万';
  return v.toLocaleString();
}

// 全选/反选
function toggleAll(id,selectAll) {
  const container=document.getElementById('cb_'+id);
  container.querySelectorAll('input[data-key]').forEach(cb=>{
    cb.checked=!selectAll?!cb.checked:true;
  });
  updateChart(id);
}
function toggleAllRate(id,selectAll) {
  const container=document.getElementById('cb_'+id);
  container.querySelectorAll('input[data-key]').forEach(cb=>{
    cb.checked=!selectAll?!cb.checked:true;
  });
  updateRateChart(id);
}

// 销毁所有图表实例
function destroyAllCharts(){
  for(const[id,c]of Object.entries(_charts)){c.destroy();delete _charts[id];}
  for(const[id,c]of Object.entries(_rateCharts)){c.destroy();delete _rateCharts[id];}
}

// ================================================================
//  工具函数
// ================================================================
function escHtml(str){
  const d=document.createElement('div');d.textContent=str;return d.innerHTML;
}
function escAttr(str){ return str.replace(/'/g,"&#39;").replace(/"/g,"&quot;"); }
function fmtShortNum(n){
  if(n>=100000000)return(n/100000000).toFixed(1)+'亿';
  if(n>=10000)return(n/10000).toFixed(1)+'万';return(n||0).toLocaleString();
}
