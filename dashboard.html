<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0b0b0b;color:#d4d4d4;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  padding:14px 20px 16px;height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-shrink:0}
.logo{font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
.logo span{color:#ff9800;margin-right:0}
.logo img{height:22px;width:auto}
.date{font-size:11px;color:#555}

/* Top fan cards */
.fans-grid{
  display:flex;gap:8px;flex-shrink:0;margin-bottom:10px;overflow-x:auto;padding-bottom:4px
}
.fans-grid::-webkit-scrollbar{height:2px}
.fans-grid::-webkit-scrollbar-thumb{background:#333;border-radius:1px}
.fan-sq{
  flex:0 0 94px;width:94px;aspect-ratio:1/1;
  background:#111;border:0.5px solid rgba(255,255,255,0.04);
  border-radius:8px;padding:8px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:2px;cursor:default;transition:background 0.2s
}
.fan-sq:hover{background:#1a1a1a}
.fan-sq .fs-name{font-size:9px;color:#666;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fan-sq .fs-num{font-size:15px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1}
.fan-sq .fs-change{font-size:9px;line-height:1}

/* Main: left ranking + right video grid */
.main-area{flex:1;display:flex;gap:12px;min-height:0}

/* Left: interaction ranking */
.ranking-panel{
  flex:0 0 280px;display:flex;flex-direction:column;
  background:#111;border:0.5px solid rgba(255,255,255,0.04);
  border-radius:7px;padding:10px 12px;overflow:hidden
}
.ranking-panel .rp-title{
  font-size:11px;color:#777;margin-bottom:8px;flex-shrink:0;
  display:flex;align-items:center;gap:5px
}
.ranking-panel .rp-title .dot{width:4px;height:4px;border-radius:50%;background:#ff9800}
.ranking-panel .rp-header{
  display:flex;align-items:center;padding:3px 6px;
  font-size:8px;color:#555;border-bottom:0.5px solid rgba(255,255,255,0.04);
  margin-bottom:4px;flex-shrink:0
}
.rp-header .col-rank{width:22px;text-align:center}
.rp-header .col-title{flex:1}
.rp-header .col-ir{width:55px;text-align:right}
.rp-header .col-play{width:60px;text-align:right}
.ranking-list{
  flex:1;overflow-y:auto
}
.ranking-list::-webkit-scrollbar{width:2px}
.ranking-list::-webkit-scrollbar-thumb{background:#333;border-radius:1px}
.rank-row{
  display:flex;align-items:center;padding:3px 6px;
  font-size:9px;border-bottom:0.5px solid rgba(255,255,255,0.02);
  transition:background 0.15s
}
.rank-row:hover{background:rgba(255,255,255,0.03)}
.rank-row .col-rank{
  width:22px;text-align:center;font-weight:700;
  font-size:10px;color:#888
}
.rank-row .col-rank.top3{color:#ff9800}
.rank-row .col-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#bbb;padding-right:4px}
.rank-row .col-ir{width:55px;text-align:right;color:#4caf50;font-weight:500}
.rank-row .col-play{width:60px;text-align:right;color:#666}
.rank-row .up-tag{font-size:7px;color:#555;margin-right:3px}

/* Right: video grid */
.video-section{flex:1;display:flex;flex-direction:column;min-width:0}
.section-label{font-size:11px;color:#666;margin-bottom:6px;flex-shrink:0}
.section-label span{color:#ff9800}
.video-grid-wrap{flex:1;overflow-y:auto;padding-right:4px}
.video-grid-wrap::-webkit-scrollbar{width:3px}
.video-grid-wrap::-webkit-scrollbar-thumb{background:#333;border-radius:1px}
.video-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:7px
}
.v-card{
  background:#111;border:0.5px solid rgba(255,255,255,0.03);
  border-radius:5px;overflow:hidden;transition:background 0.15s;cursor:default
}
.v-card:hover{background:#191919}
.v-thumb{
  width:100%;aspect-ratio:16/10;background:#181818;
  display:flex;align-items:center;justify-content:center;
  color:#2a2a2a;font-size:18px;position:relative
}
.v-thumb .v-date{position:absolute;bottom:3px;right:4px;background:rgba(0,0,0,0.7);color:#aaa;font-size:8px;padding:1px 4px;border-radius:1px}
.v-info{padding:5px 7px 7px}
.v-name{
  font-size:9px;color:#bbb;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;margin-bottom:3px;min-height:24px
}
.v-stats{font-size:8px;color:#555;display:flex;flex-wrap:wrap;gap:2px 6px}
.v-stats .up-tag{color:#ff9800}
.v-stats .cr{color:#4caf50}
.v-stats .b3{color:#f44336}

/* Bottom: single UP chart */
.bottom-section{
  flex-shrink:0;margin-top:8px;
  background:#111;border:0.5px solid rgba(255,255,255,0.04);
  border-radius:7px;padding:6px 12px 8px;height:120px;
  display:flex;flex-direction:column;
  position:relative
}
.bottom-section .box-title{
  font-size:11px;font-weight:500;color:#777;
  display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-shrink:0
}
.bottom-section .box-title .dot{width:4px;height:4px;border-radius:50%;background:#ff9800}
.bottom-section .box-title .up-indicator{
  margin-left:8px;font-size:9px;color:#ff9800
}
.bottom-chart-wrap{flex:1;position:relative;min-height:0}
.bottom-chart-wrap canvas{display:block;width:100%!important;height:100%!important}
.up-name-tag{
  position:absolute;bottom:6px;right:10px;
  font-size:10px;color:#ff9800;font-weight:600;
  background:rgba(0,0,0,0.6);padding:2px 8px;border-radius:3px
}

/* Switch dots */
.switch-dots{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:4px;z-index:2
}
.switch-dots .dot-ind{width:5px;height:5px;border-radius:50%;background:#333;transition:background 0.3s}
.switch-dots .dot-ind.active{background:#ff9800}
</style>
</head>

function fmtNum(n){
  n=parseInt(String(n).replace(/,/g,''))||0;
  if(n>=1e8)return (n/1e8).toFixed(2)+'亿';
  if(n>=1e4)return (n/1e4).toFixed(1)+'万';
  return n.toLocaleString()
}
function fmtChange(n){
  n=parseInt(n)||0;
  if(n>0)return'<span style="color:#4caf50">▲'+n.toLocaleString()+'</span>';
  if(n<0)return'<span style="color:#f44336">▼'+Math.abs(n).toLocaleString()+'</span>';
  return'<span style="color:#444">─0</span>'
}
function shortTitle(t,max){return t.length>max?t.slice(0,max)+'…':t}

function drawMiniChart(canvas, chartData){
  var videos = chartData;
  var n = videos.length;
  if (n === 0) return;

  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;

  // Use the chart-wrap container dimensions (not canvas.getBoundingClientRect which may be 0)
  var wrap = canvas.parentElement;
  var W = wrap.clientWidth;
  var H = wrap.clientHeight;

  if (W <= 0 || H <= 0) { W = 1200; H = 200; }

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  var pad = {top: 6, right: 86, bottom: 36, left: 6};
  var px = pad.left, py = pad.top, pw = W - pad.left - pad.right, ph = H - pad.top - pad.bottom;

  if (pw <= 0 || ph <= 0) return;

  var maxVal = 100;

  // No grid lines, no Y axis - values shown on bars

  var gap = pw / n;
  var barW = Math.min(gap * 0.38, 12);

  for (var i = 0; i < n; i++) {
    var cx = px + i * gap + gap / 2;
    var cr = videos[i].completion_rate || 0;
    var b3 = videos[i].bounce_3s || 0;
    var hasData = videos[i].has_data;

    // Completion rate bar (orange, left side of center)
    var crPct = cr * 100;
    var crH = (crPct / maxVal) * ph;
    ctx.fillStyle = hasData ? '#ff9800' : '#2a2200';
    ctx.fillRect(cx - barW - 1, py + ph - crH, barW, crH);

    // Bounce bar (red, right side of center)
    var b3Pct = b3 * 100;
    var b3H = (b3Pct / maxVal) * ph;
    ctx.fillStyle = hasData ? '#f44336' : '#2a0800';
    ctx.fillRect(cx + 1, py + ph - b3H, barW, b3H);

    if (!hasData) {
      ctx.fillStyle = '#e6a800';
      ctx.font = 'bold 7px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('未更新', cx, py + ph - Math.max(crH, b3H) - 3);
    }

    // Value labels on top of bars
    if (hasData) {
      ctx.fillStyle = '#ff9800';
      ctx.font = 'bold 7px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(crPct.toFixed(1) + '%', cx - barW - 1, py + ph - crH - 2);

      ctx.fillStyle = '#f44336';
      ctx.fillText(b3Pct.toFixed(1) + '%', cx + 1 + barW, py + ph - b3H - 2);
    }

    // X label: title (truncated) on top, date below
    var shortT = videos[i].title || '';
    if (shortT.length > 8) shortT = shortT.slice(0, 8) + '..';
    var dateStr = (videos[i].publish_date || '').slice(5);
    
    ctx.fillStyle = '#aaa'; ctx.font = '7px -apple-system,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.save();
    ctx.translate(cx, py + ph + 4);
    ctx.rotate(-0.45);
    ctx.fillText(shortT, 0, 0);
    ctx.fillStyle = '#666';
    ctx.fillText(dateStr, 0, 11);
    ctx.restore();
  }

  // Legend top-right
  var lx = W - pad.right + 8, ly = py;
  ctx.fillStyle = '#ff9800'; ctx.fillRect(lx, ly, 10, 7);
  ctx.fillStyle = '#999'; ctx.font = '7px -apple-system,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('完播率', lx + 13, ly - 1);
  ctx.fillStyle = '#f44336'; ctx.fillRect(lx, ly + 12, 10, 7);
  ctx.fillStyle = '#999';
  ctx.fillText('3s跳出率', lx + 13, ly + 11);
}

// === Bottom UP chart switcher ===
(function(){
  var canvas = document.getElementById('chartBottom');
  var upIndicator = document.getElementById('upIndicator');
  var upNameTag = document.getElementById('upNameTag');
  var dotsContainer = document.getElementById('switchDots');

  var upNames = Object.keys(DATA.per_up_charts);
  var currentIndex = 0;
  var switchTimer = null;

  // Build dots
  upNames.forEach(function(_, i) {
    var dot = document.createElement('div');
    dot.className = 'dot-ind';
    if (i === 0) dot.classList.add('active');
    dotsContainer.appendChild(dot);
  });

  function showUP(index) {
    currentIndex = index;
    var upName = upNames[index];
    var chartData = DATA.per_up_charts[upName];

    // Small delay to ensure DOM layout is done before measuring
    setTimeout(function() { drawMiniChart(canvas, chartData); }, 50);

    upIndicator.textContent = '· ' + upName;
    upNameTag.textContent = upName;

    // Update dots
    var dots = dotsContainer.querySelectorAll('.dot-ind');
    dots.forEach(function(d, i) {
      d.classList.toggle('active', i === index);
    });
  }

  function nextUP() {
    currentIndex = (currentIndex + 1) % upNames.length;
    showUP(currentIndex);
  }

  function startTimer() {
    clearInterval(switchTimer);
    switchTimer = setInterval(nextUP, 10000);
  }

  showUP(0);
  startTimer();

  // Resize
  window.addEventListener('resize', function() {
    showUP(currentIndex);
  });
})();

// === Auto-scroll for fans grid, ranking list, and video grid ===
(function(){
  function autoScroll(container, direction) {
    // direction: 'horizontal' or 'vertical'
    var scrollProp = direction === 'horizontal' ? 'scrollLeft' : 'scrollTop';
    var sizeProp = direction === 'horizontal' ? 'scrollWidth' : 'scrollHeight';
    var clientProp = direction === 'horizontal' ? 'clientWidth' : 'clientHeight';
    var maxScroll = container[sizeProp] - container[clientProp];

    // If content fits, no scrolling needed
    if (maxScroll <= 0) return;

    // Auto-scroll: advance by 2px per tick, loop back when at bottom/end
    var paused = false;
    setInterval(function() {
      // Only auto-scroll if user isn't actively hovering and not in pause state
      if (container.dataset.paused === 'true' || paused) return;

      var current = container[scrollProp];
      var step = direction === 'horizontal' ? 2 : 1;
      var next = current + step;

      if (next >= maxScroll) {
        // Jump back to start, then pause 3 seconds
        container[scrollProp] = 0;
        paused = true;
        setTimeout(function() { paused = false; }, 3000);
      } else {
        container[scrollProp] = next;
      }
    }, 50);
  }

  // Pause on hover
  function addHoverPause(el) {
    el.addEventListener('mouseenter', function() { el.dataset.paused = 'true'; });
    el.addEventListener('mouseleave', function() { el.dataset.paused = 'false'; });
    // Also pause on touch
    el.addEventListener('touchstart', function() { el.dataset.paused = 'true'; });
    el.addEventListener('touchend', function() { el.dataset.paused = 'false'; });
  }

  var fansGrid = document.getElementById('fansGrid');
  var rankingList = document.getElementById('rankingList');
  var videoWrap = document.querySelector('.video-grid-wrap');

  if (fansGrid) { addHoverPause(fansGrid); autoScroll(fansGrid, 'horizontal'); }
  if (rankingList) { addHoverPause(rankingList); autoScroll(rankingList, 'vertical'); }
  if (videoWrap) { addHoverPause(videoWrap); autoScroll(videoWrap, 'vertical'); }
})();
</script>
