<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#fdf8f2;
  color:#3a2e1e;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','STKaiti','Microsoft YaHei',sans-serif;
  padding:10px 20px 12px;height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
  position:relative;
}
body::before{
  content:'';position:fixed;top:-80px;left:-60px;
  width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,182,142,0.18) 0%,rgba(255,200,170,0.06) 50%,transparent 70%);
  pointer-events:none;z-index:0;
  animation:watercolorA 18s ease-in-out infinite;
}
body::after{
  content:'';position:fixed;bottom:-40px;right:-30px;
  width:360px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(142,202,255,0.13) 0%,rgba(170,220,255,0.05) 60%,transparent 75%);
  pointer-events:none;z-index:0;
  animation:watercolorB 22s ease-in-out infinite;
}
@keyframes watercolorA{
  0%,100%{transform:translate(0,0) scale(1);opacity:0.85}
  25%{transform:translate(30px,25px) scale(1.12);opacity:0.65}
  50%{transform:translate(-15px,40px) scale(0.95);opacity:0.9}
  75%{transform:translate(-25px,-10px) scale(1.08);opacity:0.7}
}
@keyframes watercolorB{
  0%,100%{transform:translate(0,0) scale(1);opacity:0.8}
  25%{transform:translate(-25px,-20px) scale(1.15);opacity:0.55}
  50%{transform:translate(20px,30px) scale(0.92);opacity:0.85}
  75%{transform:translate(-10px,15px) scale(1.1);opacity:0.6}
}
body .wc-spot3{
  content:'';position:fixed;top:45%;left:8%;
  width:280px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,120,0.1) 0%,rgba(255,180,140,0.04) 55%,transparent 72%);
  pointer-events:none;z-index:0;
  animation:watercolorC 20s ease-in-out infinite;
}
@keyframes watercolorC{
  0%,100%{transform:translate(0,0) scale(1);opacity:0.7}
  33%{transform:translate(40px,-30px) scale(1.18);opacity:0.45}
  66%{transform:translate(-30px,20px) scale(0.88);opacity:0.75}
}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-shrink:0;position:relative;z-index:1}
.header-right{display:flex;align-items:center;gap:8px}
.logo-img{width:32px;height:32px;border-radius:8px;object-fit:cover;border:1.5px solid #f0e4d4;background:#fffdf8}
.date{font-size:11px;color:#b8a898}
.fs-btn{
  background:#fffdf8;border:1.5px solid #f0e4d4;border-radius:8px;
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.2s;color:#b8a080;
}
.fs-btn:hover{border-color:#ffb68e;color:#d47a3a;background:#fff}

/* Fan cards */
.fans-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:8px;
  flex-shrink:0;margin-bottom:8px;position:relative;z-index:1
}
.fan-sq{
  background:#fffdf8;
  border:1.5px solid #f0e4d4;
  border-radius:12px;padding:6px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:2px;cursor:default;
  transition:all 0.3s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden
}
.fan-sq::before{
  content:'';position:absolute;top:-30%;right:-30%;
  width:80%;height:80%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,182,142,0.12) 0%,transparent 70%);
  pointer-events:none;transition:all 0.4s;
}
.fan-sq:hover::before{width:120%;height:120%;top:-50%;right:-50%}
.fan-sq:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 6px 18px rgba(255,160,100,0.15);border-color:#ffb68e88}
.fan-sq .fs-name{font-size:8px;color:#b8a080;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:0.3px}
.fan-sq .fs-num{font-size:9px;font-weight:700;color:#a89888;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-0.3px}
.fan-sq .fs-change{font-size:15px;line-height:1;font-weight:900}

/* Video grid */
.video-section{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;z-index:1}
.section-label{font-size:12px;color:#8a7060;margin-bottom:6px;flex-shrink:0;font-weight:700;letter-spacing:0.5px}
.section-label span{color:#d47a3a}
.video-grid-wrap{flex:1;overflow-y:auto;scrollbar-width:none}
.video-grid-wrap::-webkit-scrollbar{display:none}
.video-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  align-content:center;
  justify-items:center;
}

/* Video card */
.v-card{
  display:flex;
  background:#fffdf8;
  border:1.5px solid #f0e4d4;
  border-radius:14px;overflow:hidden;
  transition:all 0.25s cubic-bezier(.4,0,.2,1);cursor:default;
}
.v-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,160,100,0.15);border-color:#ffb68e55}

/* Left: cover + title + UP */
.v-left{
  width:46%;min-width:0;
  display:flex;flex-direction:column;
}
.v-thumb{
  width:100%;aspect-ratio:16/9;
  background:linear-gradient(135deg,#f5ede4,#ede4d8);
  position:relative;overflow:hidden;
}
.v-thumb img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform 0.3s;
}
.v-card:hover .v-thumb img{transform:scale(1.05)}
.v-thumb-fallback{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#d4c8b8
}
.v-thumb .v-date{position:absolute;bottom:3px;right:3px;background:rgba(58,46,30,0.55);color:#faf7f2;font-size:7px;padding:1px 5px;border-radius:5px;backdrop-filter:blur(4px)}
.v-title{
  font-size:10px;color:#5a4a3a;line-height:1.45;font-weight:600;
  padding:6px 7px 2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.v-up-name{
  font-size:11px;color:#d47a3a;font-weight:800;
  padding:4px 7px 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:0.5px;
}

/* Right: 2-column data */
.v-right{
  flex:1;min-width:0;
  display:flex;
  border-left:1px dashed #f0e4d4;
}
/* Left sub-column: basic stats */
.v-stats-l{
  flex:1;min-width:0;
  padding:6px 4px 6px 7px;
  display:flex;flex-direction:column;
  justify-content:center;gap:8px;
}
/* Right sub-column: advanced metrics */
.v-stats-r{
  flex:0 0 auto;
  padding:6px 7px 6px 5px;
  display:flex;flex-direction:column;
  justify-content:center;gap:8px;
  border-left:1px dotted #f0e4d4;
}
.v-icon{
  width:13px;height:13px;color:#b8a080;flex-shrink:0;
}
.v-data-row .v-dval{color:#3a2e1e}

/* Metric text-only row */
.m-row{
  display:flex;align-items:center;justify-content:flex-start;gap:4px;
  font-size:12px;font-weight:700;color:#3a2e1e;
  padding:4px 0;
}
.m-row .m-label{color:#b8a080;font-weight:600;flex-shrink:0}
.m-row .m-val-text{font-weight:700;color:#3a2e1e;font-variant-numeric:tabular-nums}
.m-na{font-size:11px;color:#c4b8a8;font-weight:500;padding:4px 0}
</style>
</head>

function fmtNum(n){
  if(n===null||n===undefined||n===''||String(n).trim()==='')return'<span style="font-size:11px;color:#c4b8a8;font-weight:500">待更新</span>';
  n=parseInt(String(n).replace(/,/g,''))||0;
  if(n<=0)return'<span style="font-size:11px;color:#c4b8a8;font-weight:500">待更新</span>';
  if(n>=1e8)return (n/1e8).toFixed(2)+'亿';
  if(n>=1e4)return (n/1e4).toFixed(1)+'万';
  return n.toLocaleString()
}
function fmtChange(n){
  n=parseInt(n)||0;
  if(n>0)return'<span style="color:#e88070">▲'+n.toLocaleString()+'</span>';
  if(n<0)return'<span style="color:#5a9a5a">▼'+Math.abs(n).toLocaleString()+'</span>';
  return'<span style="color:#d4c8b8">─0</span>'
}

function makeMetricRow(label, hasData, val, suffix){
  if(hasData){
    return '<div class="m-row"><span class="m-label">'+label+'</span><span class="m-val-text">'+val+suffix+'</span></div>';
  }
  return '<div class="m-na">待更新</div>';
}

(function(){

(function(){
  var videoWrap = document.querySelector('.video-grid-wrap');
  var videoGrid = document.getElementById('videoGrid');

  videoGrid.innerHTML = cards + cards;

  function autoScroll(container) {
    var halfHeight = container.scrollHeight / 2;
    var maxScroll = container.scrollHeight - container.clientHeight;
    if (maxScroll <= 0) return;

    setInterval(function() {
      if (container.dataset.paused === 'true') return;
      container.scrollTop += 1;
      // When scrolled past the first half (original content), silently jump back
      if (container.scrollTop >= halfHeight) {
        container.scrollTop = container.scrollTop - halfHeight;
      }
    }, 50);
  }
  videoWrap.addEventListener('mouseenter', function() { videoWrap.dataset.paused = 'true'; });
  videoWrap.addEventListener('mouseleave', function() { videoWrap.dataset.paused = 'false'; });
  videoWrap.addEventListener('touchstart', function() { videoWrap.dataset.paused = 'true'; });
  videoWrap.addEventListener('touchend', function() { videoWrap.dataset.paused = 'false'; });
  autoScroll(videoWrap);
})();
</script>
</body>
</html>
